services:
  db:
    image: postgres:16
    container_name: portfolio_poc_db
    environment:
      POSTGRES_DB: portfolio_poc
      POSTGRES_USER: portfolio_user
      POSTGRES_PASSWORD: portfolio_pass
    ports:
      - "5432:5432"
    volumes:
      - portfolio_poc_pgdata:/var/lib/postgresql/data

volumes:
  portfolio_poc_pgdata:
